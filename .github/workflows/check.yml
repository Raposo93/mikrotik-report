name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-check.txt
      - name: Install check dependencies
        run: python -m pip install -r requirements-check.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q mikrotik_report.py mikrotik_reporting
      - name: Verify systemd units
        run: ./verify-systemd-units.sh
      - name: Run Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run Pyright
        run: python -m pyright
